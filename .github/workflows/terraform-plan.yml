name: Terraform Plan

on:
  pull_request:
    branches:
      - dev
      - prod

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      DEV_ACCOUNT_ID: "414669981241"
      PROD_ACCOUNT_ID: "151632973153"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set AWS Account ID by target branch
        id: set-account
        run: |
          BRANCH_NAME="${{ github.base_ref }}"
          if [ "$BRANCH_NAME" = "prod" ]; then
            echo "AWS_ACCOUNT_ID=${{ env.PROD_ACCOUNT_ID }}" >> $GITHUB_ENV
          else
            echo "AWS_ACCOUNT_ID=${{ env.DEV_ACCOUNT_ID }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/terraform-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          BRANCH_NAME=${{ github.base_ref }}
          if [ "$BRANCH_NAME" = "prod" ]; then
            terraform plan -var-file=envs/prod/main.tfvars
          else
            terraform plan -var-file=envs/dev/main.tfvars
          fi
