name: Terraform Apply

on:
  push:
    branches:
      - dev
      - prod

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      DEV_ACCOUNT_ID: "414669981241"
      PROD_ACCOUNT_ID: "151632973153"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Choose env (dev/prod) from branch
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
            echo "AWS_ACCOUNT_ID=${{ env.PROD_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          else
            echo "ENV=dev" >> "$GITHUB_ENV"
            echo "AWS_ACCOUNT_ID=${{ env.DEV_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/terraform-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Guardrail - confirm AWS account
        shell: bash
        run: |
          echo "Expected AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }}"
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          echo "Actual AWS Account=$ACTUAL"
          test "$ACTUAL" = "${{ env.AWS_ACCOUNT_ID }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Ensure AWS_PROFILE is empty (OIDC)
        shell: bash
        run: |
          echo "AWS_PROFILE=" >> "$GITHUB_ENV"
          unset AWS_PROFILE

      - name: Terraform Init (via Make)
        shell: bash
        run: |
          if [ "${{ env.ENV }}" = "prod" ]; then
            make init-prod AWS_PROFILE=
          else
            make init-dev AWS_PROFILE=
          fi

      - name: Terraform Validate (via Make)
        run: make validate

      - name: Terraform Apply (via Make)
        shell: bash
        run: |
          if [ "${{ env.ENV }}" = "prod" ]; then
            make apply-prod AWS_PROFILE=
          else
            make apply-dev AWS_PROFILE=
          fi
