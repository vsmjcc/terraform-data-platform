name: Terraform Apply

on:
  push:
    branches:
      - dev
      - prod

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      DEV_ACCOUNT_ID: "414669981241"
      PROD_ACCOUNT_ID: "151632973153"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set env/account by branch (ref_name)
        shell: bash
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" = "prod" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
            echo "AWS_ACCOUNT_ID=${{ env.PROD_ACCOUNT_ID }}" >> "$GITHUB_ENV"
            echo "TFVARS_FILE=envs/prod/main.tfvars" >> "$GITHUB_ENV"
            echo "BACKEND_FILE=envs/prod/backend-prod.hcl" >> "$GITHUB_ENV"
          else
            echo "ENV=dev" >> "$GITHUB_ENV"
            echo "AWS_ACCOUNT_ID=${{ env.DEV_ACCOUNT_ID }}" >> "$GITHUB_ENV"
            echo "TFVARS_FILE=envs/dev/main.tfvars" >> "$GITHUB_ENV"
            echo "BACKEND_FILE=envs/dev/backend-dev.hcl" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/terraform-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Guardrail - confirm AWS account
        shell: bash
        run: |
          echo "Expected AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }}"
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          echo "Actual AWS Account=$ACTUAL"
          test "$ACTUAL" = "${{ env.AWS_ACCOUNT_ID }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init (with backend config)
        run: terraform init -backend-config=${{ env.BACKEND_FILE }} -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ env.TFVARS_FILE }}
